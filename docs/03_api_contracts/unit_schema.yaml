openapi: 3.0.0
info:
  title: Unit Schema
  version: 1.0.0
  description: Post Transformer AI Unit 数据模型定义

components:
  schemas:
    Unit:
      type: object
      required:
        - unit_id
        - unit_type
        - content
        - status
        - timestamp
      properties:
        unit_id:
          type: string
          format: uuid
          description: Unit 唯一标识符
        parent_id:
          type: string
          format: uuid
          description: 父 Unit ID
        session_id:
          type: string
          description: 会话标识符
        unit_type:
          type: string
          enum: [input, thinking, retrieval, memory, tsla, output]
          description: Unit 类型
        content_type:
          type: string
          enum: [text, code, query, result, structured]
          description: 内容类型
        content:
          type: object
          description: Unit 内容
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
          description: Unit 状态
        priority:
          type: integer
          minimum: 1
          maximum: 10
          description: 优先级
        ttl:
          type: integer
          description: 生存时间（秒）
        metadata:
          type: object
          description: 附加元数据
        timestamp:
          type: string
          format: date-time
          description: 创建时间戳

    InputUnit:
      allOf:
        - $ref: '#/components/schemas/Unit'
      properties:
        source:
          type: string
          enum: [user, api, system, trigger]
          description: 输入来源
        raw_input:
          type: string
          description: 原始输入
        parsed_intent:
          type: object
          description: 解析后的意图

    ThinkingUnit:
      allOf:
        - $ref: '#/components/schemas/Unit'
      properties:
        reasoning_type:
          type: string
          enum: [analysis, planning, deduction, induction, abduction]
          description: 推理类型
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningStep'
          description: 推理步骤
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 置信度

    ReasoningStep:
      type: object
      required:
        - step_id
        - description
      properties:
        step_id:
          type: string
          description: 步骤 ID
        step_type:
          type: string
          description: 步骤类型
        description:
          type: string
          description: 步骤描述
        inputs:
          type: array
          items:
            type: string
          description: 输入引用
        outputs:
          type: array
          items:
            type: string
          description: 输出结果
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
          description: 支持证据

    Evidence:
      type: object
      required:
        - evidence_id
        - content
        - source
      properties:
        evidence_id:
          type: string
          description: 证据 ID
        content:
          type: string
          description: 证据内容
        source:
          type: string
          description: 证据来源
        relevance:
          type: number
          minimum: 0
          maximum: 1
          description: 相关度
        credibility:
          type: number
          minimum: 0
          maximum: 1
          description: 可信度
